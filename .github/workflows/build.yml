name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CyberSecurityAwarenessChatbot.csproj
      - run: dotnet build CyberSecurityAwarenessChatbot.csproj --no-restore --configuration Release
