name: Windows .NET Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore and build WinForms app
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: CyberSecurityAwarenessChatbot.csproj

      - name: Show SDK information
        run: dotnet --info

      - name: Restore NuGet dependencies
        run: dotnet restore CyberSecurityAwarenessChatbot.csproj

      - name: Build in Release configuration
        run: dotnet build CyberSecurityAwarenessChatbot.csproj --configuration Release --no-restore
